<!doctype html><html lang="zh-CN" data-theme="paper"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>这一餐 · 互动餐桌</title><meta name="description" content="慢慢摆好一餐：添食物、咬饼干、轻放药片，拿近看看花枝杯。"><meta name="robots" content="noindex,nofollow"><style>
:root{--bg:#ece5d4;--ink:#2a2826;--mid:#77716a;--line:#bdb5a6;color-scheme:light}html[data-theme=xray]{--bg:#15181c;--ink:#d9d4c8;--mid:#a3a6a0;--line:#4a4e55;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.7 "Songti SC",STSong,serif}main{max-width:680px;margin:auto;padding:22px 24px max(30px,env(safe-area-inset-bottom))}header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}h1{font-size:23px;font-weight:400;margin:0}header span{font:italic 11px Georgia;color:var(--mid)}button{font:inherit;color:var(--mid);font-size:12px;background:none;border:0;min-height:42px;padding:7px;cursor:pointer}button[aria-pressed=true]{color:var(--ink);text-decoration:underline;text-underline-offset:6px}button:disabled{opacity:.4;cursor:default}button[hidden]{display:none}button:focus-visible,a:focus-visible,canvas:focus-visible,summary:focus-visible{outline:1px dotted var(--ink);outline-offset:3px}.styles{display:flex;justify-content:flex-end;gap:17px;border-bottom:1px solid var(--line);margin:9px 0 0}.meal-heading{display:flex;justify-content:space-between;font-size:11px;color:var(--mid);margin-top:12px}.meal-heading strong{font-weight:400;color:var(--ink)}
.tabletop{position:relative}.cup-corner{position:relative;width:100%;height:100%;display:flex;align-items:center;min-width:0}.cup-caption{display:block;text-align:center;font-size:10px;line-height:18px;color:var(--mid)}.stage{position:relative;width:100%;aspect-ratio:320/220}.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}#plate-stage canvas{cursor:default;image-rendering:pixelated;image-rendering:crisp-edges}.stage canvas:active{cursor:grabbing}#plate-labels{position:absolute;inset:0;pointer-events:none}#plate-labels span{position:absolute;font-size:10px;color:var(--ink);background:var(--bg);padding:1px 3px;transform:translate(-50%,-50%)}
.plate-actions,.small-actions{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:3px}.plate-actions button,.small-actions button{font-size:10px;min-height:40px;padding:4px}.hint{margin:1px 0 0;text-align:center;font-size:10px;color:var(--mid)}.food-menu{margin-top:18px;border-top:1px solid var(--ink);border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}.food-menu button{font-size:12px;min-height:44px}.place-actions{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:9px}.place-actions button{color:var(--ink);border-bottom:1px solid var(--ink)}#message{min-height:28px;margin:10px 0 0;font-size:11px;color:var(--mid)}.selection{display:flex;align-items:center;gap:10px;min-height:30px;font-size:11px;color:var(--mid)}.selection button{font-size:11px}.note{font-size:10px;color:var(--mid);border-top:1px solid var(--line);padding-top:12px;margin-top:18px}a{color:inherit;text-underline-offset:3px}details{font-size:11px;color:var(--mid);margin-top:9px}summary{cursor:pointer;min-height:42px;line-height:42px}details img{display:block;width:100%;max-height:640px;object-fit:contain;margin:10px 0}.reference-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cup-tools{border-top:1px solid var(--line)}.cup-modes{display:flex;gap:18px}.cup-modes button{font-size:11px}#cup-hint{text-align:left}
@media(max-width:680px){main{padding:16px 16px max(24px,env(safe-area-inset-bottom))}h1{font-size:20px}header span{font-size:9px}.styles{margin-top:5px}.meal-heading{margin-top:10px}.plate-actions{gap:0}.plate-actions button{font-size:9px}.food-menu{margin-top:13px}.note{margin-top:14px}}
button.cup-caption{width:100%;min-height:32px;padding:0}.object-view{width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 32px);padding:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}.object-view::backdrop{background:rgba(20,20,19,.65)}.object-heading{display:flex;justify-content:space-between;align-items:center;gap:12px}.object-heading h2{font-size:18px;font-weight:400;margin:0}.object-heading button{font-size:12px}.object-stage{width:100%;aspect-ratio:320/220}.object-stage canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}.food-inspector-canvas{image-rendering:pixelated}.object-view .small-actions{justify-content:flex-end}
.top-row{display:grid;grid-template-columns:2.8fr 1fr;gap:6px;align-items:stretch;padding-bottom:36px;margin:10px 0 6px}.accessory-side{position:relative;min-width:0}#accessory-stage{aspect-ratio:320/140}#accessory-stage canvas{image-rendering:pixelated;cursor:pointer}.accessory-captions{position:absolute;top:100%;left:0;right:0;display:block;height:32px}.accessory-captions button,.top-row .cup-caption{font-size:10px;min-height:32px;padding:0;width:100%}.top-row .cup-caption{position:absolute;top:100%;left:0}.cookie-picker{display:flex;justify-content:center;flex-wrap:wrap;gap:6px}.cookie-picker button{font-size:11px;min-height:40px}#cookie-take{border-bottom:1px solid var(--ink);color:var(--ink)}[hidden]{display:none!important}@media(max-width:420px){.accessory-captions button,.top-row .cup-caption{font-size:9px}.top-row{gap:4px}}
#napkin-inspect,#box-inspect{position:absolute;transform:translateX(-50%)}#napkin-inspect{left:var(--napkin-axis,18%);width:33%}#box-inspect{left:var(--box-axis,68%);width:62%}</style></head><body><main>
<header><h1>这一餐</h1><span>餐桌上的小日常</span></header>
<nav class="styles" aria-label="画法"><button data-style="material" aria-pressed="false">玻璃</button><button data-style="paper" aria-pressed="true">纸纹</button><button data-style="xray" aria-pressed="false">X 光</button></nav>
<section aria-label="餐盘与花枝杯"><div class="meal-heading"><strong>慢慢摆好一餐</strong><span id="plate-count">等一顿喜欢的饭</span></div>
<div class="tabletop"><div class="top-row"><div class="accessory-side"><div class="stage" id="accessory-stage"></div><div class="accessory-captions"><button id="napkin-inspect">小圆巾 · 药</button><button id="box-inspect">饼干盒 · 咬一口</button></div></div><aside class="cup-corner" aria-label="上排右侧的花枝杯"><div class="stage" id="cup-stage"></div><button id="cup-inspect" class="cup-caption">花枝杯 · 拿近看</button></aside></div><div class="stage" id="plate-stage"><div id="plate-labels" aria-hidden="true"></div></div></div>
<div class="plate-actions"><button id="plate-reset">整盘回位</button><button id="pattern">近看盘子</button><button id="lace-detail">近看蕾丝</button><button id="replay" disabled>再落一次</button><button id="example">摆一份餐看看</button></div><p class="hint">食物轻轻落进盘里，停稳后可以拖动摆放。</p></section>
<nav class="food-menu" aria-label="选一份食物"><button data-food="rice" aria-pressed="true">米饭</button><button data-food="noodles" aria-pressed="false">面条</button><button data-food="bread" aria-pressed="false">面包</button><button data-food="egg" aria-pressed="false">鸡蛋</button><button data-food="meat" aria-pressed="false">熟肉</button><button data-food="greens" aria-pressed="false">小青菜</button><button data-food="cherry" aria-pressed="false">樱桃</button><button data-food="cake" aria-pressed="false">蛋糕</button></nav>
<div class="place-actions"><button id="add">往盘里添一份米饭</button><button id="clear-meal" disabled>清空这一餐</button></div>
<p id="message" role="status">选一份喜欢的食物，放进盘子里。</p><div class="selection"><span id="selection"></span><button id="inspect-food" hidden>拿近看 · 360°</button><button id="remove" hidden>拿走这一份</button></div>
<details class="cup-tools"><summary>花枝杯 · 转动与轻晃</summary><div class="cup-modes"><button data-cup-mode="orbit" aria-pressed="false">转着看</button><button data-cup-mode="shake" aria-pressed="false">拖动轻晃</button></div><p class="hint" id="cup-hint">点上排的杯子拿近看。</p><div class="small-actions"><button id="cup-reset">杯子回位</button><button id="nudge">轻晃一下</button></div></details>
<details><summary>一次摆上几样</summary><button id="fill">八种食物都试试</button><button id="entry-replay">药与水 · 再摆一次</button></details>
<p class="note">一个可以慢慢摆餐的互动小页。药片为造型示意。 <a href="./credits.html">素材与许可</a></p>

<noscript><p>打开浏览器的 JavaScript 后，就可以互动摆餐。</p></noscript></main><dialog id="object-view" class="object-view" aria-labelledby="object-title"><div class="object-heading"><h2 id="object-title">拿近看</h2><button id="object-close">放回去</button></div><div id="object-stage" class="object-stage"></div><div id="cookie-picker" class="cookie-picker" hidden><button data-cookie="butterCookie" aria-pressed="false">黄油曲奇</button><button data-cookie="chipCookie" aria-pressed="false">巧克力豆</button><button data-cookie="sandwichCookie" aria-pressed="false">夹心饼干</button><button data-cookie="waferCookie" aria-pressed="false">威化</button></div><p class="hint" id="object-hint">拖动转着看，双指缩放。</p><div class="small-actions"><button id="cookie-take" hidden>咬一口</button><button id="cookie-refill" hidden>重新摆满饼干</button><button id="medicine-replay" hidden>再轻放一次</button><button id="water-replay" hidden>再倒一次水</button><button id="object-reset">回到正面</button></div></dialog><script src="./assets/meal.js"></script></body></html>
